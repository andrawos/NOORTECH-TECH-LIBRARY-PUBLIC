<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A small accessible task manager starter project."><title>NOORTECH Task List</title><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head>
<body><main class="app"><header><p class="eyebrow">NOORTECH SOURCE CODE</p><h1>Task list</h1><p class="intro">A small, dependency-free task manager starter project.</p></header>
<form id="task-form" class="composer"><label for="task-input">New task</label><div class="compose-row"><input id="task-input" name="task" maxlength="120" placeholder="What needs to be done?" required><button type="submit">Add task</button></div><p id="form-error" class="error" role="alert" aria-live="polite"></p></form>
<section aria-labelledby="tasks-heading"><div class="section-head"><h2 id="tasks-heading">Your tasks</h2><span id="task-count" class="count">0 tasks</span></div><div class="filters" role="group" aria-label="Filter tasks"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="active" aria-pressed="false">Active</button><button type="button" data-filter="done" aria-pressed="false">Completed</button></div><ul id="task-list" class="task-list" aria-live="polite"></ul><p id="empty-state" class="empty">No tasks yet. Add your first task above.</p></section>
<footer><button id="clear-done" class="clear-button" type="button">Clear completed</button><span>Tasks are stored in this browser only.</span></footer></main></body></html>

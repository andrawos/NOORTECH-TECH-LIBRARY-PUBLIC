<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOORTECH Icon Pack</title><style>body{font:16px system-ui;background:#f6f8fb;color:#172334;margin:0;padding:2rem}.wrap{max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1rem}.item{background:white;border:1px solid #dbe3ec;border-radius:14px;padding:1rem;text-align:center}.item svg{width:36px;height:36px;fill:none;stroke:#10233f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.item code{display:block;margin-top:.6rem;font-size:.75rem}</style></head><body><main class="wrap"><h1>NOORTECH Icon Pack</h1><p>12 original outline icons · SVG · no external dependencies</p><div class="grid" id="icons"></div></main><script>const names=["home","search","user","settings","menu","close","check","arrow-right","calendar","bell","heart","location"];const root=document.getElementById("icons");names.forEach(name=>{const box=document.createElement("div");box.className="item";const icon=document.createElementNS("http://www.w3.org/2000/svg","svg");const use=document.createElementNS("http://www.w3.org/2000/svg","use");use.setAttribute("href","icons.svg#nt-"+name);icon.append(use);const label=document.createElement("code");label.textContent="nt-"+name;box.append(icon,label);root.append(box);});</script></body></html>
